name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.1; leave empty to use v<pubspec version>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & run tests
        run: |
          flutter analyze
          flutter test

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing. Refusing to build with a debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/rehearse-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=rehearse-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Determine release version & build number
        id: version
        run: |
          PUBSPEC_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PUBSPEC_NAME="${PUBSPEC_RAW%%+*}"
          PUBSPEC_CODE="${PUBSPEC_RAW##*+}"
          if ! [[ "$PUBSPEC_CODE" =~ ^[0-9]+$ ]]; then
            PUBSPEC_CODE=1
          fi

          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PUBSPEC_NAME}"
          fi

          CANDIDATE="${TAG#v}"
          if [[ "$CANDIDATE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            VERSION_NAME="$CANDIDATE"
          else
            VERSION_NAME="$PUBSPEC_NAME"
          fi

          RUN_NUM="${{ github.run_number }}"
          if [ "$PUBSPEC_CODE" -gt "$RUN_NUM" ]; then
            BUILD_NUMBER="$PUBSPEC_CODE"
          else
            BUILD_NUMBER="$RUN_NUM"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define="APP_VERSION=${{ steps.version.outputs.version_name }}" \
            -P releaseSigningRequired=true

      - name: Verify APK signature and prepare release assets
        id: assets
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_NAME="rehearse-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK build-tools."
            exit 1
          fi

          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_NAME" | grep 'SHA-256 digest:' | head -n1 | awk '{print $NF}')
          echo "Signing certificate SHA-256: $CERT_SHA256"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Failed to verify APK signing certificate."
            exit 1
          fi

          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rehearse-${{ steps.version.outputs.tag }}-apk
          path: |
            ${{ steps.assets.outputs.apk_name }}
            ${{ steps.assets.outputs.apk_name }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rehearse ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.apk_name }}
            ${{ steps.assets.outputs.apk_name }}.sha256
          body: |
            ### Rehearse Android Release (`${{ steps.version.outputs.version_name }}`, build `${{ steps.version.outputs.build_number }}`)

            Download the signed Android APK directly from **Assets** below.

            - **Package ID:** `app.rehearse`
            - **APK:** `${{ steps.assets.outputs.apk_name }}`
            - **Signing Certificate (SHA-256):** `${{ steps.assets.outputs.cert_sha256 }}`
            - **Commit:** `${{ github.sha }}`

            #### Install or Update on Android
            1. Download `${{ steps.assets.outputs.apk_name }}` on your phone.
            2. Open the file from your browser downloads or file manager.
            3. Allow *Install unknown apps* if prompted, then tap **Install** or **Update**.
            4. Existing loops, markers, routines, and imported audio are preserved when updating over an earlier Rehearse release signed with the same app key.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
